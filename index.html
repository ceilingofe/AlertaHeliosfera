<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Heliosphere Alert</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face {
        font-family: 'PixelifySans';
        src: url('%BASE_URL%assets/fonts/ChakraPetch-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'PixelifySans';
        src: url('%BASE_URL%assets/fonts/ChakraPetch-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'ChakraPetch';
        src: url('%BASE_URL%assets/fonts/ChakraPetch-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'ChakraPetch';
        src: url('%BASE_URL%assets/fonts/ChakraPetch-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #181425;
        overflow: hidden;
        touch-action: none;
        font-family: 'PixelifySans', monospace;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #mobile-fs-btn {
        position: fixed;
        right: 10px;
        bottom: 10px;
        z-index: 9999;
        background: rgba(24, 20, 37, 0.85);
        color: #fee761;
        border: 1.5px solid #fee761;
        border-radius: 6px;
        padding: 6px 10px;
        font-family: 'PixelifySans', monospace;
        font-size: 13px;
        cursor: pointer;
        display: none;
      }
      @media (hover: none) and (pointer: coarse), (max-width: 920px) {
        #mobile-fs-btn {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="mobile-fs-btn" type="button" aria-label="Fullscreen">⛶ Fullscreen</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
