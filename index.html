<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Alerta Heliosfera</title>
    <style>
      @font-face {
        font-family: 'PixelifySans';
        src: url('%BASE_URL%assets/fonts/PixelifySans-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'PixelifySans';
        src: url('%BASE_URL%assets/fonts/PixelifySans-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #181425;
        overflow: hidden;
        font-family: 'PixelifySans', monospace;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
